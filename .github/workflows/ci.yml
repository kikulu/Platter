name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 只需要讀取原始碼；token 權限收到最小（資安稽核 L-6）
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 跨兩個 Node 版本跑，跟 lib/utils.js、lib/sqlite.js 主要目標的
        # LTS 版本對齊（ESLint 10 需要 Node 20.19+），避免只在單一版本上測試出現「本機能跑、CI 用的
        # 版本卻壞掉」的落差。
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # 這裡只需要跑 eslint + node --test，不需要真的啟動 Electron App
        # （GitHub Actions 的 runner 沒有顯示器，也沒辦法互動點視窗——
        # 那部分永遠要靠 npm start 手動驗證，見 ROADMAP.md）。跳過
        # electron 本身平台安裝檔的下載，避免拖慢/卡住 CI。
        # --ignore-scripts：相依套件的 install／postinstall 腳本不執行（供應鏈風險）；
        # 測試與 lint 只用純 JS 套件，不需要這些腳本。
        run: npm install --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (含文件一致性檢查)
        run: npm test
