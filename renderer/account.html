<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>新增帳號</title>
    <link rel="stylesheet" href="renderer.css" />
    <style>
      body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 16px;
      }
      .field {
        margin-bottom: 16px;
      }
      .actions {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .hint {
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.5;
      }
      #local-fields select,
      #local-fields input {
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h2 data-i18n="account.title">新增帳號</h2>

    <div class="field">
      <label class="label" data-i18n="account.platform">平台</label>
      <select id="platform">
        <option value="claude">Claude</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
        <option value="grok">Grok</option>
        <option value="local" data-i18n="account.platformLocal">本地端 AI 服務</option>
      </select>
    </div>

    <div class="field" id="local-fields" style="display: none">
      <label class="label" data-i18n="account.serviceType">服務類型</label>
      <select id="service-type">
        <option value="llm" data-i18n="account.serviceTypeLlm">LLM（語言模型）</option>
        <option value="image" data-i18n="account.serviceTypeImage">文生圖</option>
        <option value="custom" data-i18n="account.serviceTypeCustom">自訂</option>
      </select>

      <label class="label" style="margin-top: 10px" data-i18n="account.localUrl"
        >本地服務網址</label
      >
      <input type="text" id="local-url" placeholder="http://localhost:11434" />
      <div class="hint" data-i18n="account.localUrlHint">
        例如 Ollama：http://localhost:11434　／　Stable Diffusion
        WebUI：http://127.0.0.1:7860　／　ComfyUI：http://127.0.0.1:8188
      </div>
    </div>

    <div class="field">
      <label class="label" data-i18n="account.name">帳號名稱</label>
      <input
        type="text"
        id="name"
        data-i18n-placeholder="account.namePlaceholder"
        placeholder="例如：工作用、個人用"
      />
    </div>

    <div class="field">
      <label class="label" data-i18n="account.role">角色（可選）</label>
      <select id="role"></select>
    </div>

    <div class="actions">
      <button id="btn-cancel" data-i18n="account.cancel">取消</button>
      <button id="btn-confirm" class="primary" data-i18n="account.confirm">
        確認新增
      </button>
    </div>

    <script src="i18n.js"></script>
    <script src="account.js"></script>
  </body>
</html>
