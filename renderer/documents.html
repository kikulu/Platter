<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>文件庫</title>
    <link rel="stylesheet" href="renderer.css" />
    <link rel="stylesheet" href="documents.css" />
  </head>
  <body>
    <div id="doc-list-pane">
      <div id="doc-list-toolbar">
        <select id="doc-tag-filter">
          <option value="" data-i18n="knowledge.filterAll">全部標籤</option>
        </select>
        <button id="btn-import-doc" class="primary" data-i18n="documents.import">
          匯入檔案
        </button>
      </div>
      <div id="doc-list"></div>
    </div>

    <div id="doc-empty" data-i18n="documents.selectPrompt">
      從左側選擇一個文件，或點「匯入檔案」加入新的
    </div>

    <div id="doc-editor" style="display: none">
      <div
        id="doc-missing-banner"
        style="display: none"
        data-i18n="documents.missingWarning"
      >
        ⚠ 找不到原始檔案，可能已被移動或刪除
      </div>

      <div class="field">
        <label class="label" data-i18n="documents.name">名稱</label>
        <input type="text" id="doc-name" />
      </div>
      <div class="field">
        <label class="label" data-i18n="knowledge.tags">標籤（逗號分隔）</label>
        <input
          type="text"
          id="doc-tags"
          data-i18n-placeholder="knowledge.tagsPlaceholder"
        />
      </div>
      <div class="field">
        <label class="label" data-i18n="documents.notes">備註</label>
        <textarea id="doc-notes" style="min-height: 80px"></textarea>
      </div>

      <div id="doc-info-box">
        <div class="doc-info-row">
          <span data-i18n="documents.originalName">原始檔名</span
          ><span id="doc-info-original"></span>
        </div>
        <div class="doc-info-row">
          <span data-i18n="documents.source">來源</span><span id="doc-info-source"></span>
        </div>
        <div class="doc-info-row">
          <span data-i18n="documents.size">大小</span><span id="doc-info-size"></span>
        </div>
        <div class="doc-info-row">
          <span data-i18n="documents.createdAt">建立時間</span
          ><span id="doc-info-created"></span>
        </div>
        <div class="doc-info-row">
          <span data-i18n="documents.path">路徑</span
          ><span id="doc-info-path" class="doc-info-path"></span>
        </div>
      </div>

      <div id="doc-preview-box" style="display: none">
        <div
          id="doc-complex-warning"
          style="display: none"
          data-i18n="documents.docxComplexWarning"
        >
          ⚠
          此文件含表格或圖片，在此編輯並儲存後，表格會轉成純文字、圖片會被移除，原本的排版無法保留
        </div>
        <div id="doc-docx-toolbar" style="display: none">
          <button id="btn-docx-edit-toggle" data-i18n="documents.docxEdit">編輯</button>
          <span id="doc-docx-format-buttons" style="display: none">
            <button id="fmt-bold" data-cmd="bold"><b>B</b></button>
            <button id="fmt-italic" data-cmd="italic"><i>I</i></button>
            <button id="fmt-underline" data-cmd="underline"><u>U</u></button>
            <button id="fmt-h1" data-cmd="h1">H1</button>
            <button id="fmt-h2" data-cmd="h2">H2</button>
            <button id="fmt-ul" data-cmd="ul" data-i18n="documents.docxBulletList">
              • 清單
            </button>
            <button id="fmt-ol" data-cmd="ol" data-i18n="documents.docxNumberedList">
              1. 清單
            </button>
            <button id="fmt-p" data-cmd="p" data-i18n="documents.docxParagraph">
              段落
            </button>
            <button id="btn-docx-save" class="primary" data-i18n="knowledge.save">
              儲存
            </button>
          </span>
        </div>
        <div id="doc-pdf-toolbar" style="display: none">
          <button id="pdf-prev" data-i18n="documents.pdfPrevPage">← 上一頁</button>
          <span id="pdf-page-indicator"></span>
          <button id="pdf-next" data-i18n="documents.pdfNextPage">下一頁 →</button>
          <button id="pdf-zoom-out">－</button>
          <span id="pdf-zoom-indicator"></span>
          <button id="pdf-zoom-in">＋</button>
          <span id="doc-pdf-edit-buttons">
            <button id="pdf-rotate-left" data-i18n="documents.pdfRotateLeft">
              ↺ 旋轉
            </button>
            <button id="pdf-rotate-right" data-i18n="documents.pdfRotateRight">
              ↻ 旋轉
            </button>
            <button
              id="pdf-delete-page"
              class="danger"
              data-i18n="documents.pdfDeletePage"
            >
              刪除此頁
            </button>
            <button id="pdf-watermark" data-i18n="documents.pdfWatermark">加水印…</button>
            <button id="pdf-merge" data-i18n="documents.pdfMerge">合併 PDF…</button>
            <button id="pdf-extract" data-i18n="documents.pdfExtract">擷取頁面…</button>
          </span>
        </div>
        <div id="doc-preview-content" class="doc-preview-content"></div>
        <canvas id="doc-pdf-canvas" style="display: none"></canvas>
      </div>

      <div id="doc-editor-actions">
        <button id="btn-open-file" data-i18n="documents.openFile">開啟檔案</button>
        <button
          id="btn-preview-md"
          data-i18n="documents.previewMarkdown"
          style="display: none"
        >
          預覽 Markdown
        </button>
        <button id="btn-show-in-folder" data-i18n="documents.showInFolder">
          在資料夾中顯示
        </button>
        <button id="btn-delete-doc" class="danger" data-i18n="documents.remove">
          移除
        </button>
        <button id="btn-save-doc" class="primary" data-i18n="knowledge.save">儲存</button>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="documents.js"></script>
  </body>
</html>
