<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>專案計畫</title>
    <link rel="stylesheet" href="renderer.css" />
    <link rel="stylesheet" href="project.css" />
  </head>
  <body>
    <div id="proj-list-pane">
      <div id="proj-list-toolbar">
        <button id="btn-new-project" class="primary" data-i18n="project.newProject">
          新增專案
        </button>
        <button id="btn-new-from-template" data-i18n="project.newFromTemplate">
          從範本建立
        </button>
        <button id="btn-overview" data-i18n="project.overview">跨專案總覽</button>
      </div>
      <div id="proj-list"></div>
    </div>

    <div id="proj-empty" data-i18n="project.selectPrompt">
      從左側選擇一個專案，或點「新增專案」建立新的
    </div>

    <!-- 從範本建立專案：選範本 + 輸入專案主題 -->
    <div id="proj-template-picker" style="display: none">
      <h2 class="overview-title" data-i18n="project.tplTitle">從範本建立專案</h2>
      <div class="tpl-hint" data-i18n="project.tplHint">
        選一組專案範本並輸入專案主題，就會建立一個帶有分階段提示詞流程的專案；接著在專案的「階段流程」分頁，依序把每個步驟的提示詞複製給
        AI、貼回產出，逐步完成專案。
      </div>
      <div id="tpl-list"></div>
      <div class="field">
        <label class="label" data-i18n="project.tplTopic">專案主題</label>
        <textarea
          id="tpl-topic"
          style="min-height: 64px"
          data-i18n-placeholder="project.tplTopicPlaceholder"
        ></textarea>
      </div>
      <div class="field">
        <label class="label" data-i18n="project.tplName"
          >專案名稱（選填，預設用主題）</label
        >
        <input type="text" id="tpl-name" />
      </div>
      <div id="tpl-error" class="tpl-error"></div>
      <div id="tpl-actions">
        <button id="btn-tpl-cancel" data-i18n="project.tplCancel">取消</button>
        <button id="btn-tpl-create" class="primary" data-i18n="project.tplCreate">
          建立專案
        </button>
      </div>
    </div>

    <div id="proj-editor" style="display: none">
      <div class="field">
        <label class="label" data-i18n="project.name">專案名稱</label>
        <input type="text" id="proj-name" />
      </div>

      <div class="row">
        <div class="field" style="flex: 1">
          <label class="label" data-i18n="project.status">狀態</label>
          <select id="proj-status">
            <option value="planning" data-i18n="project.statusPlanning">規劃中</option>
            <option value="active" data-i18n="project.statusActive">進行中</option>
            <option value="onhold" data-i18n="project.statusOnhold">暫停</option>
            <option value="done" data-i18n="project.statusDone">已完成</option>
          </select>
        </div>
        <div class="field" style="flex: 1">
          <label class="label" data-i18n="project.startDate">開始日期</label>
          <input type="date" id="proj-start" />
        </div>
        <div class="field" style="flex: 1">
          <label class="label" data-i18n="project.endDate">結束日期</label>
          <input type="date" id="proj-end" />
        </div>
      </div>

      <div class="field">
        <label class="label" data-i18n="project.description">專案說明</label>
        <textarea id="proj-description" style="min-height: 56px"></textarea>
      </div>

      <div id="proj-tabs" class="tabbar">
        <button id="tab-tasks" class="tab-btn active" data-i18n="project.tabTasks">
          任務清單
        </button>
        <button id="tab-calendar" class="tab-btn" data-i18n="project.tabCalendar">
          月曆
        </button>
        <button id="tab-gantt" class="tab-btn" data-i18n="project.tabGantt">
          甘特圖
        </button>
        <button id="tab-issues" class="tab-btn" data-i18n="project.tabIssues">
          Issue 管理
        </button>
        <button
          id="tab-workflow"
          class="tab-btn"
          style="display: none"
          data-i18n="project.tabWorkflow"
        >
          階段流程
        </button>
      </div>

      <!-- 任務清單 -->
      <div id="panel-tasks" class="tab-panel active">
        <div class="row" style="justify-content: space-between; margin-bottom: 4px">
          <label class="label" style="margin: 0" data-i18n="project.tasks"
            >任務清單</label
          >
          <span style="display: flex; gap: 10px">
            <span id="proj-task-progress" class="settings-hint" style="margin: 0"></span>
            <span
              id="proj-task-total-hours"
              class="settings-hint"
              style="margin: 0"
            ></span>
          </span>
        </div>
        <div id="proj-task-list"></div>
        <div class="row" style="margin-top: 8px">
          <input
            type="text"
            id="proj-new-task-input"
            data-i18n-placeholder="project.taskTitlePlaceholder"
          />
          <button id="btn-add-task">＋</button>
        </div>
      </div>

      <!-- 月曆檢視 -->
      <div id="panel-calendar" class="tab-panel">
        <div id="cal-toolbar" class="cal-toolbar">
          <button id="btn-cal-prev">‹</button>
          <span id="cal-month-label"></span>
          <button id="btn-cal-next">›</button>
          <button id="btn-cal-today" data-i18n="project.calendarToday">回到今天</button>
        </div>
        <div id="cal-weekdays"></div>
        <div id="cal-grid"></div>
        <div id="cal-day-detail"></div>
      </div>

      <!-- 甘特圖 -->
      <div id="panel-gantt" class="tab-panel">
        <div id="gantt-empty" data-i18n="project.ganttEmpty">
          尚未有任何含日期的任務，幫任務加上開始/到期日就能看到甘特圖
        </div>
        <div id="gantt-container"></div>
      </div>

      <!-- Issue 管理 -->
      <div id="panel-issues" class="tab-panel">
        <div
          class="row"
          style="justify-content: space-between; margin-bottom: 4px; align-items: center"
        >
          <label class="label" style="margin: 0" data-i18n="project.issues"
            >Issue 清單</label
          >
          <select id="issue-filter-status">
            <option value="" data-i18n="project.filterAllStatus">全部狀態</option>
            <option value="open" data-i18n="project.issueStatusOpen">待處理</option>
            <option value="inprogress" data-i18n="project.issueStatusInprogress">
              處理中
            </option>
            <option value="resolved" data-i18n="project.issueStatusResolved">
              已解決
            </option>
            <option value="closed" data-i18n="project.issueStatusClosed">已關閉</option>
          </select>
        </div>
        <div id="proj-issue-list"></div>
        <div class="row" style="margin-top: 8px">
          <button id="btn-add-issue" data-i18n="project.addIssue">＋ 新增 Issue</button>
        </div>
      </div>

      <!-- 階段流程：依序執行範本的分階段提示詞（只有從範本建立的專案才有） -->
      <div id="panel-workflow" class="tab-panel">
        <div class="wf-meta">
          <div class="field" style="flex: 2">
            <label class="label" data-i18n="project.wfTopic">專案主題</label>
            <input type="text" id="wf-topic" />
          </div>
          <div class="field" style="flex: 1">
            <label class="label" data-i18n="project.wfContextMode"
              >前面步驟產出的帶入方式</label
            >
            <select id="wf-context-mode">
              <option value="all" data-i18n="project.wfContextAll">全部帶入</option>
              <option value="previous" data-i18n="project.wfContextPrevious">
                只帶入上一步
              </option>
              <option value="none" data-i18n="project.wfContextNone">
                不帶入（同一段 AI 對話已有）
              </option>
            </select>
          </div>
        </div>
        <div id="wf-progress"></div>
        <div id="wf-body">
          <div id="wf-steps"></div>
          <div id="wf-detail">
            <div id="wf-detail-title"></div>
            <div id="wf-detail-stage"></div>
            <label class="label" data-i18n="project.wfPromptLabel"
              >本步驟要複製給 AI 的提示詞（已帶入主題與前面步驟的產出）</label
            >
            <textarea id="wf-prompt-preview" readonly></textarea>
            <details id="wf-prompt-edit-box">
              <summary data-i18n="project.wfEditPrompt">編輯本步驟提示詞原文</summary>
              <textarea id="wf-prompt-edit"></textarea>
            </details>
            <div class="wf-actions">
              <button id="btn-wf-copy" class="primary" data-i18n="project.wfCopy">
                複製提示詞
              </button>
            </div>
            <label class="label" data-i18n="project.wfOutputLabel"
              >AI 的產出（貼回這裡；會帶入後面步驟的提示詞）</label
            >
            <textarea
              id="wf-output"
              data-i18n-placeholder="project.wfOutputPlaceholder"
            ></textarea>
            <div id="wf-saved-hint"></div>
            <div class="wf-actions">
              <button id="btn-wf-prev" data-i18n="project.wfPrev">上一步</button>
              <button id="btn-wf-reset" data-i18n="project.wfReset">重設為待辦</button>
              <button id="btn-wf-done" class="primary" data-i18n="project.wfDoneNext">
                標記完成並前往下一步
              </button>
            </div>
          </div>
        </div>
        <div id="wf-template-save">
          <label class="label" data-i18n="project.wfSaveTemplateLabel"
            >把這個流程另存為專案範本（含你在這個專案改過的提示詞，不含產出）</label
          >
          <div class="row">
            <input
              type="text"
              id="wf-template-name"
              data-i18n-placeholder="project.wfTemplateNamePlaceholder"
            />
            <button id="btn-wf-save-template" data-i18n="project.wfSaveTemplate">
              另存為範本
            </button>
          </div>
          <div id="wf-template-saved"></div>
        </div>
      </div>

      <div id="proj-editor-actions">
        <button id="btn-delete-project" class="danger" data-i18n="project.delete">
          刪除專案
        </button>
        <button id="btn-save-project" class="primary" data-i18n="project.save">
          儲存專案
        </button>
      </div>
    </div>

    <!-- 跨專案總覽：把所有專案的月曆/甘特圖/Issue 疊在一起看 -->
    <div id="proj-overview" style="display: none">
      <h2 class="overview-title" data-i18n="project.overviewTitle">跨專案總覽</h2>
      <div id="ov-legend"></div>

      <div id="ov-tabs" class="tabbar">
        <button
          id="tab-ov-calendar"
          class="tab-btn active"
          data-i18n="project.tabCalendar"
        >
          月曆
        </button>
        <button id="tab-ov-gantt" class="tab-btn" data-i18n="project.tabGantt">
          甘特圖
        </button>
        <button id="tab-ov-issues" class="tab-btn" data-i18n="project.tabIssues">
          Issue 管理
        </button>
      </div>

      <div id="ov-panel-calendar" class="tab-panel active">
        <div id="ov-cal-toolbar" class="cal-toolbar">
          <button id="btn-ov-cal-prev">‹</button>
          <span id="ov-cal-month-label"></span>
          <button id="btn-ov-cal-next">›</button>
          <button id="btn-ov-cal-today" data-i18n="project.calendarToday">
            回到今天
          </button>
        </div>
        <div id="ov-cal-weekdays"></div>
        <div id="ov-cal-grid"></div>
        <div id="ov-cal-day-detail"></div>
      </div>

      <div id="ov-panel-gantt" class="tab-panel">
        <div id="ov-gantt-empty" data-i18n="project.ganttEmpty">
          尚未有任何含日期的任務，幫任務加上開始/到期日就能看到甘特圖
        </div>
        <div id="ov-gantt-container"></div>
      </div>

      <div id="ov-panel-issues" class="tab-panel">
        <div
          class="row"
          style="justify-content: space-between; margin-bottom: 4px; align-items: center"
        >
          <label class="label" style="margin: 0" data-i18n="project.issues"
            >Issue 清單</label
          >
          <select id="ov-issue-filter-status">
            <option value="" data-i18n="project.filterAllStatus">全部狀態</option>
            <option value="open" data-i18n="project.issueStatusOpen">待處理</option>
            <option value="inprogress" data-i18n="project.issueStatusInprogress">
              處理中
            </option>
            <option value="resolved" data-i18n="project.issueStatusResolved">
              已解決
            </option>
            <option value="closed" data-i18n="project.issueStatusClosed">已關閉</option>
          </select>
        </div>
        <div id="ov-issue-list"></div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="project.js"></script>
  </body>
</html>
